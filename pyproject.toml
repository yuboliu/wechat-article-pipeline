[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-article-pipeline"
version = "1.0.0"
description = "微信公众号文章 抓取 → Obsidian 风格转换 → 结构校验 → 落库 的一体化流水线"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "yuboliu" },
]
dependencies = [
  "camoufox[geoip]",
  "markdownify",
  "beautifulsoup4",
  "httpx",
  "requests",
  "pyyaml",
]
keywords = ["wechat", "markdown", "obsidian", "crawler", "camoufox", "agent-skill"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/yuboliu/wechat-article-pipeline"
Issues = "https://github.com/yuboliu/wechat-article-pipeline/issues"
Upstream = "https://github.com/jackwener/wechat-article-to-markdown"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
wechat-article-to-markdown = "wechat_article_to_markdown:main"

[tool.setuptools]
py-modules = ["wechat_article_to_markdown"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "e2e: live end-to-end tests that require network and a browser runtime",
]
